<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clone Blocker — Danh sách công khai</title>
  <meta name="description" content="Danh sách công khai các tài khoản Facebook và Threads đã bị báo cáo, xem xét thủ công và quyết định công bố.">
  <link rel="stylesheet" href="public.css">
</head>
<body>
  <!--
    Every visible string on this page is language-dependent, so the markup is
    only mount points: public.js builds the content from its dictionary in the
    reader's language. Spelling the Vietnamese here as well would give the page
    two copies of the same sentence, and the one nobody re-reads is the one
    that goes stale.
  -->
  <header class="masthead">
    <div class="wrap bar">
      <a class="brand" href="./">
        <span class="mark" aria-hidden="true"></span>
        <span class="brandtext" id="brandName"></span>
      </a>
      <div class="langtoggle" id="langToggle" role="group"></div>
    </div>
  </header>

  <main class="wrap">
    <section class="intro" id="intro"></section>
    <section class="statwrap" id="stats" hidden></section>

    <section class="register" aria-labelledby="registerHd">
      <h2 class="eyebrow" id="registerHd"></h2>
      <div class="controls" id="controls" hidden></div>
      <p class="resultline" id="resultline" hidden></p>
      <div id="cards" class="cards"></div>
      <p class="state" id="state" role="status"></p>
    </section>

    <section class="notice" id="notice"></section>
  </main>

  <footer class="wrap foot" id="foot"></footer>

  <noscript>
    <p class="wrap state">Trang này cần JavaScript để đọc danh sách.
       — This page needs JavaScript to read the list.</p>
  </noscript>

  <!-- No module, no framework, no build step: one classic script, served from
       this origin, which is all the CSP in firebase.json permits. -->
  <script src="public.js"></script>
</body>
</html>
