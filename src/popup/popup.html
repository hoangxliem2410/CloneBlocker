<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Clone Blocker</title>
  <link rel="stylesheet" href="../ui/ui.css">
</head>
<body class="popup">
  <header class="hd">
    <h1>Clone Blocker</h1>
    <span id="platform" class="pill">—</span>
  </header>

  <!-- What this page is, and what you can do about it. Everything else on this
       popup is subordinate to this card. -->
  <section class="card" id="pageCard">
    <div id="who" class="who">—</div>
    <div id="whoState" class="state"></div>

    <button id="reportProfile" class="btn primary">Report as a clone</button>
    <button id="blockProfile" class="btn hidden">Block now</button>
    <p class="note" id="actionNote"></p>
  </section>

  <!-- What it actually did here. -->
  <section class="card">
    <div class="row">
      <span class="k">Hidden on this page</span>
      <span class="v" id="hiddenCount">—</span>
    </div>
    <label class="toggle">
      <input type="checkbox" id="hideEnabled">
      <span>Hide clones on Facebook &amp; Threads</span>
    </label>
    <p class="note" id="blockingNote"></p>
    <div id="blockError" class="err hidden"></div>
  </section>

  <footer>
    <span id="listLine" class="foot-note">—</span>
    <span class="foot-links">
      <a href="#" id="refresh">Refresh</a>
      <a href="#" id="openOptions">Settings</a>
    </span>
  </footer>

  <script src="../common/protocol.js"></script>
  <script src="popup.js"></script>
</body>
</html>
